<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video page</title>
<style>
html,body{margin:0;height:100%;background:#F7F6E5;overflow:hidden}
.stage{position:relative;width:100%;max-width:1440px;aspect-ratio:16/9;margin:0 auto;overflow:hidden;background:#0b2a20}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:in 1.2s cubic-bezier(.2,.9,.2,1) .1s both}
@keyframes in{from{opacity:0;transform:scale(1.06);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
#snd{position:absolute;right:2%;bottom:3.5%;font:600 13px/1 system-ui,sans-serif;color:#fff;background:rgba(11,42,32,.55);
  padding:9px 14px;border-radius:99px;pointer-events:none;letter-spacing:.04em;opacity:0;animation:in 1s 1.6s both}
@media (prefers-reduced-motion:reduce){video{animation:none}}
</style></head><body>
<!-- Reusable video page:  pages/video.html?v=video/yourfile.mp4&poster=video/poster.jpg
     Plays automatically (muted, looping). Click the video to turn sound on / off. -->
<div class="stage"><video id="v" muted loop playsinline autoplay preload="auto"></video><div id="snd">Click for sound</div></div>
<script>
  const q = new URLSearchParams(location.search), v = document.getElementById('v'), snd = document.getElementById('snd');
  if (q.get('poster')) v.poster = q.get('poster');
  v.src = q.get('v') || '';
  v.play().catch(()=>{});
  v.addEventListener('click', () => { v.muted = !v.muted; snd.textContent = v.muted ? 'Click for sound' : 'Sound on · click to mute'; v.play().catch(()=>{}); });
</script>
<script src="../assets/bridge.js"></script>
</body></html>
