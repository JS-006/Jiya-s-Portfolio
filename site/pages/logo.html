<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo Page Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
    /* Smooth Up/Down Page Transition Motion */
:root{--bg:#f5f3e6;--ease:cubic-bezier(.2,.8,.2,1)}
*{margin:0;box-sizing:border-box}

html,body{height:100%;background:#F7F6E5}

body{display:grid;place-items:center}
.stage{width:min(100vw,calc(100vh*1.7845));aspect-ratio:1918.29/1074.86}
svg{width:100%;height:100%;display:block}
.d{transform-box:fill-box}
.line{fill:none;stroke:#c97154;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) .3s forwards, fadeline 1s 3.2s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeline{from{}to{}}
.f-green{fill:#2d5643}.f-dark{fill:#264a3d}.f-orange{fill:#c97154}
.f-green,.f-dark,.f-orange{opacity:0;animation:grow 1.4s var(--ease) forwards}
.tr-fill{transform-origin:100% 0;animation-delay:.1s}
.br-leaf{transform-origin:100% 100%;animation-delay:.6s}
.bl-fill{transform-origin:0 100%;animation-delay:.2s}
.bl-dark{transform-origin:0 100%;animation-delay:.5s}
@keyframes grow{from{opacity:0;transform:scale(.2) rotate(-8deg)}to{opacity:1;transform:none}}
/* gentle sway after intro */
.sway{animation:sway 7s ease-in-out 2.5s infinite alternate;transform-box:fill-box}
.tc{opacity:0;animation:rise .7s var(--ease) forwards;animation-delay:calc(.5s + var(--i)*.07s)}
@keyframes rise{from{opacity:0}to{opacity:1}}
.title{font:800 128.27px 'Archivo Black','Franklin Gothic Heavy','Arial Black',Impact,sans-serif;fill:#1a4236;letter-spacing:-.01em}
.tile{opacity:0;transform-box:fill-box;transform-origin:center;animation:tin 1s var(--ease) forwards;animation-delay:calc(1.2s + var(--t)*.35s)}
@keyframes tin{from{opacity:0;transform:translateY(50px) scale(.92)}to{opacity:1;transform:none}}
.pic{clip-path:inset(0 100% 0 0);animation:wipe 1.2s var(--ease) forwards;animation-delay:calc(1.5s + var(--t)*.35s)}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
#replay{position:fixed;right:16px;bottom:16px;font:600 14px system-ui;padding:10px 16px;border:0;border-radius:99px;background:#c97154;color:#fff;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
