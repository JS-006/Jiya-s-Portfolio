<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image page</title>
<style>
html,body{margin:0;height:100%;background:#F7F6E5;overflow:hidden}
.stage{position:relative;width:100%;max-width:1440px;aspect-ratio:16/9;margin:0 auto;overflow:hidden;background:#F7F6E5}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:in 1.3s cubic-bezier(.2,.9,.2,1) .15s both}
@keyframes in{from{opacity:0;transform:scale(1.07) translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion:reduce){.stage img{animation:none}}
</style></head><body>
<!-- Reusable page: shows ONE full-page image.  Use:  pages/image.html?img=img/yourfile.jpg -->
<div class="stage"><img id="im" alt=""></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('im').src = q.get('img') || '';
</script>
<script src="../assets/bridge.js"></script>
</body></html>
