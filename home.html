<style>
    
html{scroll-behavior:smooth}
body{margin:0;background:#F7F6E5}
a{color:#231F20;text-decoration:none}
a:hover{color:#B4543A}
.in{animation:slide .95s cubic-bezier(.2,1.25,.35,1) var(--d) both}
@keyframes slide{from{translate:var(--x) 0;opacity:0}to{translate:0 0;opacity:1}}
.idle{transform-box:fill-box;transform-origin:50% 50%;animation:bob 4.2s ease-in-out calc(var(--d) + 2.6s) infinite;transition:fill .3s}
.idle:hover{fill:#C96048}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop 1.1s cubic-bezier(.2,.9,.3,1.15) 2.3s both}
@keyframes pop{from{translate:0 160px;opacity:0;scale:.94}to{translate:0 0;opacity:1;scale:1}}
.float{transform-box:fill-box;transform-origin:50% 100%;animation:float 5s ease-in-out 3.4s infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(.9deg)}}
.name{animation:nameIn .9s ease 3.2s both}
@keyframes nameIn{from{translate:-80px 0;opacity:0}to{translate:0 0;opacity:1}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,14px)}}
.drift2{animation:drift2 11s ease-in-out infinite alternate}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-18px,-12px)}}
.leaf{transform-box:fill-box;transform-origin:50% 100%;animation:leaf 4s ease-in-out infinite alternate}
@keyframes leaf{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.sp svg{animation:nudgeX 1.4s ease-in-out infinite}
@keyframes nudgeX{50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
</head>
