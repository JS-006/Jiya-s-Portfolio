<style>
    /* Smooth Up/Down Page Transition Motion */
html{scroll-behavior:smooth}
body{margin:0;background:#F7F6E5}
a{color:#231F20;text-decoration:none}
a:hover{color:#B4543A}
.tl{animation:tl .85s cubic-bezier(.2,1.2,.4,1) var(--d) both}
@keyframes tl{from{translate:var(--tx) 70px;rotate:var(--tr);opacity:0}to{translate:0 0;rotate:0deg;opacity:1}}
.ic,.ib,.ih{transform-box:fill-box;transform-origin:50% 50%}
.ic{animation:burst 1s cubic-bezier(.2,1.2,.35,1) var(--d) both}
@keyframes burst{from{translate:var(--fx) var(--fy);rotate:var(--fr);scale:.2;opacity:0}to{translate:0 0;rotate:0deg;scale:1;opacity:1}}
.ib{animation:ibob 4s ease-in-out var(--b) infinite}
@keyframes ibob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.r0 .ib{animation-name:wig;animation-duration:3.2s}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-4px)}}
.ih{transition:transform .35s cubic-bezier(.2,1.6,.4,1);cursor:pointer}
.ih:hover{transform:scale(1.15) rotate(-3deg)}
.dv{transform-box:fill-box;transform-origin:50% 0%;animation:dv 1s ease .6s both}
@keyframes dv{from{scale:1 0}to{scale:1 1}}
.bk{animation:nameIn .9s ease 3s both}
.bk svg,.sp svg{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
@keyframes nameIn{from{translate:-80px 0;opacity:0}to{translate:0 0;opacity:1}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,14px)}}
.drift2{animation:drift2 11s ease-in-out infinite alternate}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-18px,-12px)}}
.leaf{transform-box:fill-box;transform-origin:50% 100%;animation:leaf 4s ease-in-out infinite alternate}
@keyframes leaf{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
